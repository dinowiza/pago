<!doctype html>
<html lang="en" x-data x-bind:data-theme="$store.theme.value">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Roboto:wght@400;500&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module">import { customAlphabet } from 'https://cdn.jsdelivr.net/npm/nanoid@5.0.7/+esm'; window.PagoNanoid = customAlphabet('0123456789abcdefghijklmnopqrstuvwxyz', 8)</script>
    <script defer src="app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body x-data="app" @page:deployed.window="reloadPages" @dragenter.prevent="handleDragEnter($event)" @dragleave.window="handleDragLeave($event)" @dragend.window="clearDragging()" @blur.window="clearDragging()" @dragover.prevent @drop.prevent="handleMainDrop($event)">
    <div class="page-shell">
      <header class="app-header">
        <a class="app-logo" href="/" aria-label="Pago home">Pago</a>
        <div class="header-actions">
          <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme" @click="$store.theme.toggle()">
            <span aria-hidden="true" x-text="$store.theme.value === 'dark' ? '☼' : '◐'"></span>
          </button>
        </div>
      </header>

      <main class="app-main" aria-label="Pages">
        <section class="site-grid" aria-label="Deployed pages">
          <template x-for="page in pages" :key="page.slug">
            <article class="site-card" role="link" tabindex="0" @click="openPage(page)" @keydown.enter.prevent="openPage(page)">
              <div class="preview-slab">
                <iframe class="preview-frame" :src="previewUrl(page)" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
              </div>
              <details class="card-menu" @click.stop @click.outside="$el.removeAttribute('open')" @keydown.escape.prevent="$el.removeAttribute('open')">
                <summary aria-label="Page options">⋯</summary>
                <div class="card-menu-panel">
                  <a :href="page.url" target="_blank" rel="noopener" @click.stop>Open</a>
                  <button type="button" @click.stop="editPage(page)">Edit</button>
                  <button type="button" @click.stop="copyUrl(page)">Copy link</button>
                  <button class="danger" type="button" @click.stop="deletePage(page)">Delete</button>
                </div>
              </details>
              <h2 class="card-title" x-text="page.name || page.slug"></h2>
            </article>
          </template>

          <button class="card-add" type="button" @click="openDialog()">
            <span>+</span>
            <strong>Add page</strong>
            <small>Paste HTML, upload files, or drop a ZIP</small>
          </button>
        </section>
      </main>
    </div>

    <div class="drag-overlay" x-cloak x-show="dragging" x-transition.opacity>
      <div>
        <p class="eyebrow">Drop files</p>
        <strong>Drop to deploy</strong>
      </div>
    </div>

    <dialog id="addDialog" class="add-dialog" x-data="addDialog" @cancel.self.prevent="close">
      <form method="dialog" class="dialog-surface" @submit.prevent="deploy">
        <div class="dialog-header">
          <div>
            <h2 x-text="editSlug ? 'Edit page' : 'Add page'"></h2>
          </div>
          <button class="btn-secondary" type="button" @click="chooseFiles()">Upload</button>
        </div>

        <input class="sr-only" type="file" multiple accept=".html,.htm,.css,.js,.json,.svg,.png,.jpg,.jpeg,.webp,.gif,.woff,.woff2,.zip" x-ref="fileInput" @change="validateFiles($event.target.files)" @cancel.stop="restoreFileChoiceState()">

        <div class="editor-zone" :class="extracting ? 'is-loading' : ''">
          <textarea x-show="mode === 'editor' && !isLoadingEdit" x-model="htmlContent" @input="syncEditorState" placeholder="Paste HTML or drag files here…"></textarea>
          <div class="file-summary" x-show="mode === 'files' && !isLoadingEdit">
            <strong x-text="extracting ? 'Extracting ZIP...' : files.length ? files.length + ' file(s) ready' : 'Choose files or drop them on the page'"></strong>
            <template x-if="files.length">
              <ul>
                <template x-for="file in files.slice(0, 6)" :key="file.name">
                  <li x-text="file.name"></li>
                </template>
              </ul>
            </template>
          </div>
          <div class="loading-state" x-show="isLoadingEdit">
            <strong>Loading page…</strong>
            <span>Preparing editor content</span>
          </div>
        </div>

        <div class="rename-banner" x-show="renameTarget">
          <span x-text="renameTarget ? 'Use ' + renameTarget.name + ' as index.html?' : ''"></span>
          <div>
            <button class="btn-secondary" type="button" @click="cancelRename()">Cancel</button>
            <button class="btn-primary" type="button" @click="confirmRename()">Use as index</button>
          </div>
        </div>

        <label class="field-label">
          <span>Page name</span>
          <input type="text" x-model="pageName" @input="syncPageName" maxlength="80" placeholder="Portfolio v2">
        </label>

        <div class="dialog-footer">
          <button class="btn-secondary" type="button" @click="close()">Cancel</button>
          <button class="btn-primary" type="submit" :disabled="!canDeploy || deploying" x-text="deploying ? 'Saving...' : editSlug ? 'Update' : 'Save'"></button>
        </div>
      </form>
    </dialog>

    <div class="toast-stack" aria-live="polite">
      <template x-for="toast in $store.toasts.items" :key="toast.id">
        <div class="toast" :class="toast.type" x-text="toast.message"></div>
      </template>
    </div>

    <div class="app-modal-backdrop" x-cloak x-show="$store.modal.isOpen" x-transition.opacity @click.self="$store.modal.close()">
      <section class="app-modal" role="dialog" aria-modal="true" :aria-labelledby="$store.modal.type + '-title'">
        <h2 :id="$store.modal.type + '-title'" x-text="$store.modal.title"></h2>
        <p x-text="$store.modal.message"></p>
        <div class="app-modal-actions">
          <template x-if="$store.modal.type === 'confirm'">
            <button class="btn-secondary" type="button" @click="$store.modal.close()" x-text="$store.modal.cancelLabel"></button>
          </template>
          <button :class="$store.modal.type === 'confirm' ? 'btn-danger' : 'btn-primary'" type="button" @click="$store.modal.type === 'confirm' ? $store.modal.confirm() : $store.modal.close()" x-text="$store.modal.confirmLabel"></button>
        </div>
      </section>
    </div>
  </body>
</html>
