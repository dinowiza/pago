services:
  worker:
    image: node:20-bookworm-slim
    working_dir: /app
    command: npx --yes wrangler pages dev . --ip 0.0.0.0 --port 8787 --compatibility-date 2024-09-01 --persist-to /data
    ports:
      - "8787:8787"
    volumes:
      - ./:/app
      - wrangler_state:/data
      - /app/node_modules
    environment:
      - WRANGLER_SEND_METRICS=false
      - CI=true
      - TOKEN=${TOKEN:-dev-token-change-me}

volumes:
  wrangler_state:
